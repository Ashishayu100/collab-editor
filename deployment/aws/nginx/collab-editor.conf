# Host-level Nginx reverse proxy — installed at /etc/nginx/sites-available/collab-editor by
# deploy.sh. This is SEPARATE from the Nginx baked into the client Docker image
# (client/nginx/default.conf), which only serves static files inside its own container on
# 127.0.0.1:8080. This config is what actually terminates SSL and faces the internet:
#
#   Internet -> [this Nginx :80/:443] -> 127.0.0.1:8080 (client container, static files)
#                                      -> 127.0.0.1:3001 (server container, /api and /ws)

upstream app_server {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream app_client {
    server 127.0.0.1:8080;
    keepalive 8;
}

# Rate limiting zones — a second layer on top of the app's own per-user/IP limits (see
# server/src/middleware/rateLimiter.ts), protecting Nginx/Docker itself from being overwhelmed
# before a request ever reaches the app.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;

# Redirect HTTP -> HTTPS. Commented out until setup-ssl.sh has run — certbot's --nginx plugin
# rewrites this file to add the redirect itself (via --redirect), so don't uncomment manually.
# server {
#     listen 80;
#     server_name YOUR_DOMAIN;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;                    # Uncomment after running setup-ssl.sh
    server_name YOUR_DOMAIN_OR_IP;

    # ─── SSL (certbot fills these in automatically — see setup-ssl.sh) ──────
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;
    # add_header Strict-Transport-Security "max-age=63072000" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml image/svg+xml;

    # ─── Client requests — static files and SPA fallback ─────────
    location / {
        proxy_pass http://app_client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://app_client;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── API requests ─────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF export runs headless Chromium server-side and can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        client_max_body_size 10m;
    }

    # ─── WebSocket — the Yjs/awareness/comment-event channel ─────
    location /ws {
        limit_req zone=ws_limit burst=10 nodelay;

        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived collaboration sessions alive.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Health check — no rate limit, so uptime monitors never get 429'd ─────
    location = /api/health {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
